<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – SocialBook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="logo"><a href="index.html">SocialBook</a></div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h2>Log In</h2>
      <p class="auth-sub">Enter your email and password to continue.</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Log In</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2024 SocialBook</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
