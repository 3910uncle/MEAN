<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – SocialBook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="logo"><a href="index.html">SocialBook</a></div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="auth-sub">It's quick and easy.</p>
      <form id="registerForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="First name" required />
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Last name" required />
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" />
        </div>
        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" required />
        </div>
        <div class="form-group">
          <label>Gender</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="female" /> Female</label>
            <label><input type="radio" name="gender" value="male" /> Male</label>
            <label><input type="radio" name="gender" value="other" /> Other</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary full-width">Sign Up</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2024 SocialBook</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
