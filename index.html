<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialBook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="logo">SocialBook</div>
    <nav class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main class="hero">
    <div class="hero-content">
      <h1>Connect with friends and the world around you.</h1>
      <p>SocialBook helps you share moments, stay in touch, and build community.</p>
      <div class="hero-actions">
        <a href="register.html" class="btn btn-primary">Create New Account</a>
        <a href="login.html" class="btn btn-secondary">Log In</a>
      </div>
    </div>
    <div class="hero-image">
      <div class="phone-mockup">
        <div class="post-card">
          <div class="post-avatar"></div>
          <div class="post-text">
            <div class="post-name"></div>
            <div class="post-line"></div>
            <div class="post-line short"></div>
          </div>
        </div>
        <div class="post-card">
          <div class="post-avatar alt"></div>
          <div class="post-text">
            <div class="post-name"></div>
            <div class="post-line"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2024 SocialBook &mdash; MEAN Stack Project</p>
  </footer>
</body>
</html>
